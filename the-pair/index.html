<!DOCTYPE html>
<html lang="en">
<head>
  <!--
    READING ROOM 2.0 — THE PAIR (branch-only prototype)
    One juxtaposition. Two pieces of evidence from two notebooks, one question.
    Nothing is explained. No navigation, no links, no analytics, no storage.

    Sources (verbatim from the live site's repository, modern-dharma-site @ 64cd451):
      Book       — assets/process.pdf, Chapter 5 · Process (the published sample chapter)
      Journal    — _data/journal.yml, field observation "The pattern was visible
                   long before I understood it." / "Mount Athos. A mountain
                   casting its own triangular shadow across the landscape."
      Question   — the site's recurring question (homepage footer, inquiry cycle)
  -->
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="robots" content="noindex, nofollow">
  <title>Modern Dharma</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;1,400&family=Inter:wght@400;500&display=swap" rel="stylesheet">
  <style>
    /* Tokens copied from moderndharma.life style.css */
    :root {
      --black: #0b0b0b;
      --gold: #caa33c;
      --ivory: #f0ece3;
      --muted: #aaa59a;
      --line: rgba(202, 163, 60, 0.22);

      --pause: 2600ms;     /* between one notebook and the other */
    }
    @media (prefers-reduced-motion: reduce) { :root { --pause: 0ms; } }

    * { box-sizing: border-box; margin: 0; }
    html, body { min-height: 100%; }
    body {
      background: var(--black);
      color: var(--ivory);
      font-family: "Cormorant Garamond", Georgia, serif;
      -webkit-font-smoothing: antialiased;
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 12vh 6vw;
    }

    .pair {
      width: min(1040px, 100%);
      display: grid;
      grid-template-columns: minmax(0, 1fr) auto minmax(0, 1fr);
      align-items: center;
      gap: clamp(2rem, 6vw, 5.5rem);
    }

    .evidence { display: grid; gap: 2rem; }
    .evidence blockquote {
      font-size: clamp(1.55rem, 2.7vw, 2.25rem);
      line-height: 1.32;
      font-weight: 400;
    }
    .evidence .image {
      display: block;
      margin-top: 1.1rem;
      color: var(--muted);
      font-style: italic;
      font-size: .78em;
      line-height: 1.45;
    }
    .source {
      font-family: "Inter", Arial, sans-serif;
      font-size: .62rem;
      font-weight: 500;
      letter-spacing: .2em;
      line-height: 1.9;
      text-transform: uppercase;
      color: rgba(202, 163, 60, .7);
    }
    .source b { display: block; font-weight: 500; color: var(--gold); }

    .between {
      color: var(--gold);
      font-size: 1.1rem;
      align-self: center;
    }

    .question {
      grid-column: 1 / -1;
      margin-top: clamp(4rem, 10vh, 7rem);
      padding-top: 2.4rem;
      border-top: 1px solid var(--line);
      text-align: center;
      font-weight: 500;
      font-size: clamp(1.8rem, 3.4vw, 2.6rem);
    }

    /* Arrival: one notebook, then the other, then where they came from, then the question. */
    .arrive { opacity: 0; transform: translateY(6px); animation: arrive 2.2s ease forwards; }
    .a1 { animation-delay: .6s; }
    .a2 { animation-delay: calc(.6s + var(--pause)); }
    .a3 { animation-delay: calc(1.6s + var(--pause) * 2); }
    .a4 { animation-delay: calc(2.4s + var(--pause) * 3.4); }
    @keyframes arrive { to { opacity: 1; transform: none; } }
    @media (prefers-reduced-motion: reduce) {
      .arrive { animation: none; opacity: 1; transform: none; }
    }

    @media (max-width: 760px) {
      body { place-items: start center; padding: 14vh 1.4rem 10vh; }
      .pair { grid-template-columns: 1fr; gap: 3rem; }
      .between { justify-self: start; }
      .question { text-align: left; }
    }
  </style>
</head>
<body>
  <main class="pair" aria-label="Two pieces of evidence and one question">

    <figure class="evidence">
      <blockquote class="arrive a1">Not telepathy. Pattern recognition. Most parental emergencies announced themselves long before words arrived.</blockquote>
      <figcaption class="source arrive a3"><b>Book</b>What Is Trying To Emerge? · Chapter 5 · Process</figcaption>
    </figure>

    <div class="between arrive a3" aria-hidden="true">△</div>

    <figure class="evidence">
      <blockquote class="arrive a2">The pattern was visible long before I understood it.
        <span class="image">A mountain casting its own triangular shadow across the landscape.</span>
      </blockquote>
      <figcaption class="source arrive a3"><b>Journal · Field Observation</b>Mount Athos</figcaption>
    </figure>

    <p class="question arrive a4">What keeps showing up?</p>

  </main>
</body>
</html>
