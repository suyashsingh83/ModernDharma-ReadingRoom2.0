<!DOCTYPE html>
<html lang="en">
<head>
  <!--
    READING ROOM 2.0 — RECOGNITION JOURNEY (branch-only prototype)

    Threshold → Recognition → Further recognition → The question → Book 1.
    The site shows, places, juxtaposes and invites. It never interprets.

    MATERIAL. Every fragment is verbatim from the published site
    (modern-dharma-site @ 64cd451):
      Book       — assets/process.pdf, Chapter 5 · Process (published sample)
      Journal    — _data/journal.yml (inquiries and principles)
      Field      — _data/journal.yml (the two field observations)
      Book 1 title, subtitle, Kindle link — _data/book.yml / index.html
    READER positions are left open on purpose. The only reader quotes on
    the site sit in the unlinked /map/ prototype and could not be verified.
    To fill one, put a real, permissioned observation in `text` and its
    place in `place` (see CONSTELLATIONS below).
    noindex. No analytics. No storage. No accounts.
  -->
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="robots" content="noindex, nofollow">
  <title>The Reading Room | Modern Dharma</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;1,400&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    /* Tokens copied from moderndharma.life style.css */
    :root {
      --black: #0b0b0b;
      --black-soft: #11110f;
      --gold: #caa33c;
      --gold-rgb: 202, 163, 60;
      --ivory: #f0ece3;
      --muted: #aaa59a;
      --line: rgba(202, 163, 60, 0.22);
      --white-line: rgba(255,255,255,.08);
      --hold: 2600ms;
    }
    @media (prefers-reduced-motion: reduce) { :root { --hold: 800ms; } }

    * { box-sizing: border-box; margin: 0; }
    html, body { min-height: 100%; }
    body {
      background: var(--black);
      color: var(--ivory);
      font-family: "Cormorant Garamond", Georgia, serif;
      -webkit-font-smoothing: antialiased;
    }
    .label {
      font-family: "Inter", Arial, sans-serif;
      font-size: .64rem; font-weight: 500; letter-spacing: .22em;
      text-transform: uppercase; color: var(--gold);
    }
    .label span { margin-right: .7rem; }
    .fade { opacity: 0; transform: translateY(6px); transition: opacity 1.8s ease, transform 1.8s ease; }
    .fade.on { opacity: 1; transform: none; }
    @media (prefers-reduced-motion: reduce) { .fade { transform: none; transition-duration: .3s; } }

    /* ---------- Stage 1 · Threshold ---------- */
    .threshold {
      position: fixed; inset: 0; z-index: 2;
      display: grid; place-items: center; padding: 1.4rem;
      user-select: none; -webkit-user-select: none;
    }
    .threshold::before {
      content: ""; position: absolute; inset: 0; pointer-events: none;
      background: radial-gradient(ellipse 38% 52% at 50% 44%, rgba(var(--gold-rgb), .14), transparent 70%);
      opacity: var(--p, 0);
    }
    .threshold-stack { position: relative; display: grid; justify-items: center; gap: 3rem; }
    .door {
      position: relative;
      width: clamp(104px, 20vw, 140px); aspect-ratio: 9 / 19;
      border: 1px solid var(--line); background: transparent; padding: 0;
      cursor: pointer; touch-action: none; outline: none;
    }
    .door:focus-visible { box-shadow: 0 0 0 1px rgba(var(--gold-rgb), .5); }
    .door .gap {
      position: absolute; top: 0; bottom: 0; right: 0;
      width: calc(2px + var(--p, 0) * 100%);
      background: linear-gradient(to left, rgba(var(--gold-rgb), .9), rgba(var(--gold-rgb), .45));
      box-shadow: 0 0 calc(6px + var(--p, 0) * 50px) rgba(var(--gold-rgb), calc(.2 + var(--p, 0) * .4));
      animation: pulse 7s ease-in-out infinite;
    }
    .door.held .gap { animation: none; }
    @keyframes pulse { 0%, 100% { opacity: .5; } 50% { opacity: .9; } }
    @media (prefers-reduced-motion: reduce) { .door .gap { animation: none; opacity: .75; } }
    .threshold-words { text-align: center; display: grid; gap: .9rem; opacity: calc(1 - var(--p, 0) * 2.5); }
    .threshold-words .hint { color: rgba(170,165,154,.7); font-size: .58rem; letter-spacing: .24em; }

    .flood {
      position: fixed; inset: 0; z-index: 3; pointer-events: none;
      background: radial-gradient(ellipse 70% 80% at 50% 44%, rgba(var(--gold-rgb), .32), var(--black) 75%);
      opacity: 0; transition: opacity 1.4s ease;
    }
    .flood.on { opacity: 1; }

    /* ---------- Stages 2–3 · Constellations ---------- */
    .journey { display: none; min-height: 100vh; background: var(--black-soft); }
    .journey.on { display: block; }
    .field {
      width: min(1100px, 100%);
      margin: 0 auto;
      padding: 12vh 6vw 6vh;
      min-height: 88vh;
      display: grid;
      grid-template-columns: repeat(12, minmax(0, 1fr));
      grid-template-rows: auto clamp(3rem, 12vh, 8rem) auto;
      column-gap: 1.5rem;
      align-content: center;
      transition: opacity 1.2s ease;
    }
    .field.leaving { opacity: 0; }
    .numeral { grid-column: 1 / -1; grid-row: 2; align-self: center; text-align: center; color: rgba(var(--gold-rgb), .55); }

    .piece { display: grid; gap: 1.2rem; align-content: start; }
    .piece blockquote { font-size: clamp(1.3rem, 2.1vw, 1.75rem); line-height: 1.34; }
    .piece .image { display: block; margin-top: .75rem; color: var(--muted); font-style: italic; font-size: .82em; line-height: 1.45; }
    .piece figcaption {
      font-family: "Inter", Arial, sans-serif; font-size: .58rem; font-weight: 500;
      letter-spacing: .2em; line-height: 1.9; text-transform: uppercase; color: rgba(var(--gold-rgb), .68);
    }
    .piece figcaption b { display: block; font-weight: 500; color: var(--gold); }
    .piece.open blockquote {
      height: 2.6rem; border-bottom: 1px dashed rgba(170,165,154,.28);
    }
    .piece.open figcaption { color: rgba(170,165,154,.6); }

    /* Three arrangements, so no two constellations sit the same way. */
    .layout-a .book    { grid-column: 1 / 6;  grid-row: 1; }
    .layout-a .journal { grid-column: 8 / 13; grid-row: 1; margin-top: 6rem; }
    .layout-a .field-note { grid-column: 2 / 6; grid-row: 3; }
    .layout-a .reader  { grid-column: 7 / 12; grid-row: 3; margin-top: 3.5rem; }

    .layout-b .reader  { grid-column: 1 / 5;  grid-row: 1; margin-top: 2rem; }
    .layout-b .book    { grid-column: 6 / 13; grid-row: 1; margin-top: 5rem; }
    .layout-b .field-note { grid-column: 1 / 7; grid-row: 3; margin-top: 1rem; }
    .layout-b .journal { grid-column: 8 / 13; grid-row: 3; margin-top: 4rem; }

    .layout-c .journal { grid-column: 2 / 7;  grid-row: 1; }
    .layout-c .book    { grid-column: 7 / 13; grid-row: 3; }
    .layout-c .reader  { grid-column: 1 / 5;  grid-row: 3; margin-top: 5rem; }

    /* The one control. Its words change once: from looking to asking. */
    .control { width: min(1100px, 100%); margin: 0 auto; padding: 0 6vw 14vh; text-align: center; }
    .next {
      appearance: none; border: 0; background: transparent; padding: 0; cursor: pointer;
      display: inline-flex; flex-direction: column; align-items: center; gap: .45rem;
      color: rgba(var(--gold-rgb), .82);
      font: 500 .64rem/1.4 "Inter", Arial, sans-serif; letter-spacing: .24em; text-transform: uppercase;
      opacity: 0; pointer-events: none; transition: opacity 1.4s ease, color .2s ease, transform .2s ease;
    }
    .next.ready { opacity: 1; pointer-events: auto; }
    .next:hover, .next:focus-visible { color: var(--gold); transform: translateY(2px); outline: none; }
    .next:focus-visible { outline: 1px solid var(--gold); outline-offset: .7rem; }
    .next.asking {
      font: 500 clamp(1.8rem, 3.6vw, 2.6rem)/1.1 "Cormorant Garamond", Georgia, serif;
      letter-spacing: 0; text-transform: none; color: var(--ivory);
    }
    .next.asking:hover, .next.asking:focus-visible { color: var(--gold); }
    .next .arrow { font: 500 .64rem/1 "Inter", Arial, sans-serif; color: var(--gold); }

    /* ---------- Stage 4 · The question ---------- */
    .question, .book-threshold {
      display: none;
      width: min(760px, 100%); margin: 0 auto; padding: 0 6vw; text-align: center;
    }
    .question.on, .book-threshold.on { display: block; }
    .question { padding-top: 18vh; }
    .question .q { margin-top: 1.6rem; font-weight: 500; font-size: clamp(2.4rem, 5.4vw, 3.8rem); line-height: 1.04; }
    .question .tri { display: block; margin-top: 1.8rem; color: var(--gold); font-size: 1.1rem; }

    /* ---------- Stage 5 · Book 1 threshold ---------- */
    .book-threshold { padding-top: 9vh; padding-bottom: 26vh; }
    .book-threshold .invite { color: var(--muted); font-size: clamp(1.3rem, 2.4vw, 1.65rem); line-height: 1.5; }
    .book-threshold .title {
      margin-top: 2.6rem; font-weight: 500; font-size: clamp(2.6rem, 6vw, 4.4rem); line-height: .98; letter-spacing: -.02em;
      color: var(--gold);
      background-image: linear-gradient(100deg, #9b7427, #d7b85e 46%, #b8892c 72%, #ead27b);
      background-size: 160% 100%;
      -webkit-background-clip: text; background-clip: text; -webkit-text-fill-color: transparent;
    }
    .book-threshold .sub { margin-top: 1.2rem; color: var(--muted); font-style: italic; font-size: 1.15rem; }
    .book-threshold .links { margin-top: 3.4rem; display: flex; flex-direction: column; align-items: center; gap: 1.6rem; }
    .book-threshold a {
      display: inline-flex; gap: .55rem; align-items: center; text-decoration: none;
      color: var(--gold); font: 600 .64rem/1.5 "Inter", Arial, sans-serif; letter-spacing: .16em; text-transform: uppercase;
    }
    .book-threshold a.quiet { color: rgba(170,165,154,.8); font-weight: 500; }
    .book-threshold a:hover, .book-threshold a:focus-visible { color: #e0bd61; }

    @media (max-width: 760px) {
      .field { grid-template-columns: repeat(6, minmax(0, 1fr)); grid-template-rows: none; row-gap: 3rem; padding: 12vh 1.4rem 6vh; }
      .field .piece { grid-row: auto !important; margin-top: 0 !important; }
      .field .piece:nth-of-type(odd)  { grid-column: 1 / 6 !important; }
      .field .piece:nth-of-type(even) { grid-column: 2 / 7 !important; }
      .numeral { grid-row: auto; text-align: left; order: -1; }
      .control { padding: 0 1.4rem 12vh; }
    }
  </style>
</head>
<body>

  <!-- Stage 1 · Threshold -->
  <section class="threshold" id="threshold" aria-label="Threshold">
    <div class="threshold-stack">
      <button class="door" id="door" type="button" aria-label="The Reading Room. Press and hold to enter.">
        <span class="gap"></span>
      </button>
      <div class="threshold-words" aria-hidden="true">
        <p class="label fade" id="t1"><span>△</span>The Reading Room</p>
        <p class="label hint fade" id="t2">Press and hold to enter</p>
      </div>
    </div>
  </section>
  <div class="flood" id="flood"></div>

  <!-- Stages 2–5 -->
  <main class="journey" id="journey">
    <div class="field" id="field" aria-live="polite"></div>
    <div class="control">
      <button class="next" id="next" type="button"><span class="t">Keep looking</span><span class="arrow" aria-hidden="true">↓</span></button>
    </div>

    <section class="question" id="question" aria-labelledby="q">
      <p class="label fade" id="q-label">Investigation Journal</p>
      <p class="q fade" id="q" tabindex="-1">Is this a pattern?</p>
      <span class="tri fade" id="q-tri" aria-hidden="true">△</span>
    </section>

    <section class="book-threshold" id="book" aria-label="The first Modern Dharma investigation">
      <p class="invite fade" id="b1">If this question interests you,<br>the first Modern Dharma investigation begins here.</p>
      <p class="title fade" id="b2">What Is Trying<br>To Emerge?</p>
      <p class="sub fade" id="b3">A Modern Dharma Inquiry</p>
      <div class="links fade" id="b4">
        <a href="https://moderndharma.life/assets/process.pdf" target="_blank" rel="noopener noreferrer"><span aria-hidden="true">△</span><span>Read Chapter 5, where the book fragments were found</span><span aria-hidden="true">→</span></a>
        <a class="quiet" href="https://www.amazon.de/dp/B0HNGSR2J2" target="_blank" rel="noopener noreferrer">Read on Kindle <span aria-hidden="true">↗</span></a>
      </div>
    </section>
  </main>

  <script>
    /* ------------------------------------------------------------
       The constellations. No themes, no titles, no captions:
       only what was found, and where it was found.
       `order` is the sequence in which pieces arrive.
       ------------------------------------------------------------ */
    const CONSTELLATIONS = [
      {
        numeral: 'I', layout: 'a', order: ['book', 'field', 'journal', 'reader'],
        pieces: {
          book:    { text: 'Not telepathy. Pattern recognition. Most parental emergencies announced themselves long before words arrived.',
                     source: 'Book', place: 'What Is Trying To Emerge? · Chapter 5 · Process' },
          journal: { text: 'Why Certainty became less important?', image: 'Not the title. Not the approved version. The movement that keeps returning.',
                     source: 'Journal · Inquiry', place: '' },
          field:   { text: 'The pattern was visible long before I understood it.', image: 'A mountain casting its own triangular shadow across the landscape.',
                     source: 'Field Observation', place: 'Mount Athos' },
          reader:  { text: null, source: 'Reader', place: 'Not yet contributed' }
        }
      },
      {
        numeral: 'II', layout: 'b', order: ['field', 'reader', 'book', 'journal'],
        pieces: {
          book:    { text: 'Because the valencies had never really been the problem. They were the missing piece beneath the problem.',
                     source: 'Book', place: 'What Is Trying To Emerge? · Chapter 5 · Process' },
          journal: { text: 'The difficult part about waiting.', image: 'What if life is happening while you wait.',
                     source: 'Journal · Principle', place: '' },
          field:   { text: 'The garden changed. Or perhaps the possibility was there all along. The work was learning to see it.',
                     source: 'Field Observation', place: 'The garden' },
          reader:  { text: null, source: 'Reader', place: 'Not yet contributed' }
        }
      },
      {
        // Deliberately the weakest and most ambiguous: no field note, and a
        // journal entry that pulls against the book fragment rather than echoing it.
        numeral: 'III', layout: 'c', order: ['journal', 'book', 'reader'],
        pieces: {
          book:    { text: 'The valencies were suddenly available. Not understood. But available. Which turned out to be enough.',
                     source: 'Book', place: 'What Is Trying To Emerge? · Chapter 5 · Process' },
          journal: { text: 'What if understanding isn’t enough?', image: 'Understanding can reveal every piece and still leave reality unchanged.',
                     source: 'Journal · Inquiry', place: '' },
          reader:  { text: null, source: 'Reader', place: 'Not yet contributed' }
        }
      }
    ];

    (() => {
      const $ = id => document.getElementById(id);
      const reduced = matchMedia('(prefers-reduced-motion: reduce)').matches;
      const wait = ms => new Promise(r => setTimeout(r, reduced ? Math.min(ms, 150) : ms));
      const show = el => requestAnimationFrame(() => requestAnimationFrame(() => el.classList.add('on')));

      /* ---------- Stage 1 · Threshold ---------- */
      const threshold = $('threshold'), door = $('door');
      const HOLD = parseFloat(getComputedStyle(document.documentElement).getPropertyValue('--hold'));
      let p = 0, holding = false, last = 0, raf = 0, entered = false;

      setTimeout(() => $('t1').classList.add('on'), reduced ? 0 : 1200);
      setTimeout(() => $('t2').classList.add('on'), reduced ? 0 : 3400);

      function tick(now) {
        const dt = last ? now - last : 16; last = now;
        p = Math.max(0, Math.min(1, p + (holding ? dt / HOLD : -dt / (HOLD * 1.6))));
        threshold.style.setProperty('--p', (p * p * (3 - 2 * p)).toFixed(4));
        if (p >= 1 && !entered) return enter();
        if (holding || p > 0) raf = requestAnimationFrame(tick); else { raf = 0; last = 0; }
      }
      const press = e => { if (entered) return; e.preventDefault(); holding = true; door.classList.add('held'); if (!raf) { last = 0; raf = requestAnimationFrame(tick); } };
      const release = () => { holding = false; door.classList.remove('held'); };
      door.addEventListener('pointerdown', e => { door.setPointerCapture?.(e.pointerId); press(e); });
      door.addEventListener('pointerup', release);
      door.addEventListener('pointercancel', release);
      door.addEventListener('contextmenu', e => e.preventDefault());
      door.addEventListener('keydown', e => { if ((e.key === ' ' || e.key === 'Enter') && !e.repeat) press(e); });
      door.addEventListener('keyup', e => { if (e.key === ' ' || e.key === 'Enter') release(); });
      door.focus({ preventScroll: true });

      async function enter() {
        entered = true; holding = false; cancelAnimationFrame(raf);
        const flood = $('flood');
        flood.classList.add('on');
        await wait(1500);
        threshold.remove();
        $('journey').classList.add('on');
        flood.classList.remove('on');
        await wait(1600);
        flood.remove();
        constellation(0);
      }

      /* ---------- Stages 2–3 · Constellations ---------- */
      const field = $('field'), next = $('next');
      let index = 0, busy = false;

      function piece(kind, data) {
        const fig = document.createElement('figure');
        fig.className = 'piece ' + (kind === 'field' ? 'field-note' : kind) + (data.text ? '' : ' open');
        const q = document.createElement('blockquote');
        q.className = 'fade';
        if (data.text) {
          q.textContent = data.text;
          if (data.image) { const s = document.createElement('span'); s.className = 'image'; s.textContent = data.image; q.append(s); }
        } else {
          q.setAttribute('aria-label', 'No reader observation has been contributed here yet.');
        }
        const cap = document.createElement('figcaption');
        cap.className = 'fade';
        const b = document.createElement('b'); b.textContent = data.source;
        cap.append(b, data.place || '');
        fig.append(q, cap);
        return { fig, q, cap };
      }

      async function constellation(i) {
        busy = true;
        const c = CONSTELLATIONS[i];
        field.className = 'field layout-' + c.layout;
        field.innerHTML = '';
        field.setAttribute('aria-label', 'Constellation ' + c.numeral);
        const parts = {};
        for (const kind of ['book', 'journal', 'field', 'reader']) {
          if (!c.pieces[kind]) continue;
          parts[kind] = piece(kind, c.pieces[kind]);
          field.append(parts[kind].fig);
        }
        const numeral = document.createElement('p');
        numeral.className = 'label numeral fade';
        numeral.textContent = c.numeral;
        field.append(numeral);

        window.scrollTo({ top: 0, behavior: 'auto' });
        await wait(700);
        show(numeral);
        await wait(1600);
        // Each piece arrives on its own; its source follows its words.
        for (const kind of c.order) {
          show(parts[kind].q);
          await wait(1100);
          show(parts[kind].cap);
          await wait(1900);
        }
        // Time to look before anything else is offered.
        const finalOne = i === CONSTELLATIONS.length - 1;
        await wait(finalOne ? 6000 : 3600);
        if (finalOne) {
          next.classList.add('asking');
          next.querySelector('.t').textContent = 'Is this a pattern?';
          next.querySelector('.arrow').textContent = '';
        }
        next.classList.add('ready');
        busy = false;
      }

      next.addEventListener('click', async () => {
        if (busy) return;
        next.classList.remove('ready');
        if (index < CONSTELLATIONS.length - 1) {
          field.classList.add('leaving');
          await wait(1200);
          field.classList.remove('leaving');
          constellation(++index);
          return;
        }
        ask();
      });

      /* ---------- Stage 4 · The question (asked by the visitor) ---------- */
      async function ask() {
        busy = true;
        next.remove();
        field.classList.add('leaving');
        await wait(1400);
        field.remove();
        const qs = $('question'); qs.classList.add('on');
        window.scrollTo({ top: 0, behavior: 'auto' });
        show($('q-label')); await wait(900);
        show($('q')); $('q').focus({ preventScroll: true });
        await wait(1200); show($('q-tri'));

        /* ---------- Stage 5 · Book 1 threshold ---------- */
        await wait(6000);   // silence: the question is left alone with the visitor first
        const book = $('book'); book.classList.add('on');
        await wait(200);
        // Keep the question in view: the invitation refers to it.
        window.scrollTo({ top: Math.max(0, qs.offsetTop + qs.offsetHeight - innerHeight * 0.32), behavior: reduced ? 'auto' : 'smooth' });
        await wait(900);
        for (const id of ['b1', 'b2', 'b3', 'b4']) { show($(id)); await wait(id === 'b1' ? 2600 : 1500); }
      }
    })();
  </script>
</body>
</html>
