<!DOCTYPE html>
<html lang="en">
<head>
  <!--
    READING ROOM 2.0 — RECOGNITION JOURNEY · Update 4 (branch-only prototype)

    Threshold → Constellation I–IV → the room goes quiet → the question → Book 1.
    The site shows, places, juxtaposes and invites. It never interprets.
    The Reading Room is Act I: clues, not conclusions.

    MATERIAL
      Book fragments and Investigation Journal questions for Chapters 2, 6, 11,
      12, 13, 14 and 18 are used exactly as supplied by the author in the
      "Prototype Update 4" brief. The manuscript itself is not in this
      repository, so they have not been checked against it here.
      Chapter 5 (one fragment) is verbatim from the published sample,
      modern-dharma-site/assets/process.pdf.
      Field observations are verbatim from modern-dharma-site/_data/journal.yml
      (the image lines only, not the recognition titles).
      Not used: Reader material (removed for this prototype) and Chapter 21
      (it contains answers).
    noindex. No analytics. No storage. No accounts.
  -->
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="robots" content="noindex, nofollow">
  <title>The Reading Room | Modern Dharma</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;1,400&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    /* Tokens copied from moderndharma.life style.css */
    :root {
      --black: #0b0b0b;
      --black-soft: #11110f;
      --gold: #caa33c;
      --gold-rgb: 202, 163, 60;
      --ivory: #f0ece3;
      --muted: #aaa59a;
      --line: rgba(202, 163, 60, 0.22);
      --hold: 2600ms;
    }
    @media (prefers-reduced-motion: reduce) { :root { --hold: 800ms; } }

    * { box-sizing: border-box; margin: 0; }
    html, body { min-height: 100%; }
    body {
      background: var(--black);
      color: var(--ivory);
      font-family: "Cormorant Garamond", Georgia, serif;
      -webkit-font-smoothing: antialiased;
    }
    .label {
      font-family: "Inter", Arial, sans-serif;
      font-size: .64rem; font-weight: 500; letter-spacing: .22em;
      text-transform: uppercase; color: var(--gold);
    }
    .label span { margin-right: .7rem; }
    .fade { opacity: 0; transform: translateY(6px); transition: opacity 1.8s ease, transform 1.8s ease; }
    .fade.on { opacity: 1; transform: none; }
    @media (prefers-reduced-motion: reduce) { .fade { transform: none; transition-duration: .3s; } }

    /* ---------- Stage 1 · Threshold ---------- */
    .threshold {
      position: fixed; inset: 0; z-index: 2;
      display: grid; place-items: center; padding: 1.4rem;
      user-select: none; -webkit-user-select: none;
    }
    .threshold::before {
      content: ""; position: absolute; inset: 0; pointer-events: none;
      background: radial-gradient(ellipse 38% 52% at 50% 44%, rgba(var(--gold-rgb), .14), transparent 70%);
      opacity: var(--p, 0);
    }
    .threshold-stack { position: relative; display: grid; justify-items: center; gap: 3rem; }
    .door {
      position: relative;
      width: clamp(104px, 20vw, 140px); aspect-ratio: 9 / 19;
      border: 1px solid var(--line); background: transparent; padding: 0;
      cursor: pointer; touch-action: none; outline: none;
    }
    .door:focus-visible { box-shadow: 0 0 0 1px rgba(var(--gold-rgb), .5); }
    .door .gap {
      position: absolute; top: 0; bottom: 0; right: 0;
      width: calc(2px + var(--p, 0) * 100%);
      background: linear-gradient(to left, rgba(var(--gold-rgb), .9), rgba(var(--gold-rgb), .45));
      box-shadow: 0 0 calc(6px + var(--p, 0) * 50px) rgba(var(--gold-rgb), calc(.2 + var(--p, 0) * .4));
      animation: pulse 7s ease-in-out infinite;
    }
    .door.held .gap { animation: none; }
    @keyframes pulse { 0%, 100% { opacity: .5; } 50% { opacity: .9; } }
    @media (prefers-reduced-motion: reduce) { .door .gap { animation: none; opacity: .75; } }
    .threshold-words { text-align: center; display: grid; gap: .9rem; opacity: calc(1 - var(--p, 0) * 2.5); }
    .threshold-words .hint { color: rgba(170,165,154,.7); font-size: .58rem; letter-spacing: .24em; }

    .flood {
      position: fixed; inset: 0; z-index: 3; pointer-events: none;
      background: radial-gradient(ellipse 70% 80% at 50% 44%, rgba(var(--gold-rgb), .32), var(--black) 75%);
      opacity: 0; transition: opacity 1.4s ease;
    }
    .flood.on { opacity: 1; }

    /* ---------- Stages 2–5 · Constellations ---------- */
    .journey { display: none; min-height: 100vh; background: var(--black-soft); }
    .journey.on { display: block; }
    .field {
      width: min(1100px, 100%);
      margin: 0 auto;
      padding: 12vh 6vw 6vh;
      min-height: 88vh;
      display: grid;
      grid-template-columns: repeat(12, minmax(0, 1fr));
      grid-template-rows: auto clamp(3rem, 12vh, 8rem) auto;
      column-gap: 1.5rem;
      align-content: center;
      transition: opacity 1.2s ease;
    }
    .field.leaving { opacity: 0; }
    .numeral { grid-column: 1 / -1; grid-row: 2; align-self: center; text-align: center; color: rgba(var(--gold-rgb), .55); }

    .piece { display: grid; gap: 1.2rem; align-content: start; }
    .piece blockquote { font-size: clamp(1.3rem, 2.1vw, 1.75rem); line-height: 1.34; white-space: pre-line; }
    .piece.journal blockquote { font-style: italic; }
    .piece figcaption {
      font-family: "Inter", Arial, sans-serif; font-size: .58rem; font-weight: 500;
      letter-spacing: .2em; line-height: 1.9; text-transform: uppercase; color: rgba(var(--gold-rgb), .68);
    }
    .piece figcaption b { display: block; font-weight: 500; color: var(--gold); }

    /* Four arrangements, so no two constellations sit the same way. */
    .layout-a .p1 { grid-column: 1 / 6;  grid-row: 1; }
    .layout-a .p2 { grid-column: 8 / 13; grid-row: 1; margin-top: 6rem; }
    .layout-a .p3 { grid-column: 2 / 6;  grid-row: 3; }
    .layout-a .p4 { grid-column: 7 / 12; grid-row: 3; margin-top: 3.5rem; }

    .layout-b .p1 { grid-column: 3 / 9;  grid-row: 1; }
    .layout-b .p2 { grid-column: 1 / 5;  grid-row: 3; margin-top: 3rem; }
    .layout-b .p3 { grid-column: 8 / 13; grid-row: 3; }

    .layout-c .p1 { grid-column: 1 / 5;  grid-row: 1; margin-top: 2rem; }
    .layout-c .p2 { grid-column: 6 / 13; grid-row: 1; margin-top: 5rem; }
    .layout-c .p3 { grid-column: 1 / 7;  grid-row: 3; margin-top: 1rem; }
    .layout-c .p4 { grid-column: 8 / 13; grid-row: 3; margin-top: 4rem; }

    .layout-d .p1 { grid-column: 7 / 13; grid-row: 1; }
    .layout-d .p2 { grid-column: 1 / 6;  grid-row: 1; margin-top: 5rem; }
    .layout-d .p3 { grid-column: 3 / 8;  grid-row: 3; margin-top: 1rem; }
    .layout-d .p4 { grid-column: 9 / 13; grid-row: 3; margin-top: 5rem; }

    /* The one control. It only ever offers more looking. */
    .control { width: min(1100px, 100%); margin: 0 auto; padding: 0 6vw 14vh; text-align: center; }
    .next {
      appearance: none; border: 0; background: transparent; padding: 0; cursor: pointer;
      display: inline-flex; flex-direction: column; align-items: center; gap: .45rem;
      color: rgba(var(--gold-rgb), .82);
      font: 500 .64rem/1.4 "Inter", Arial, sans-serif; letter-spacing: .24em; text-transform: uppercase;
      opacity: 0; pointer-events: none; transition: opacity 1.4s ease, color .2s ease, transform .2s ease;
    }
    .next.ready { opacity: 1; pointer-events: auto; }
    .next:hover, .next:focus-visible { color: var(--gold); transform: translateY(2px); outline: none; }
    .next:focus-visible { outline: 1px solid var(--gold); outline-offset: .7rem; }
    .next .arrow { color: var(--gold); }

    /* ---------- Stage 6 · The question ---------- */
    .question, .book-threshold {
      display: none;
      width: min(760px, 100%); margin: 0 auto; padding: 0 6vw; text-align: center;
    }
    .question.on, .book-threshold.on { display: block; }
    .question { padding-top: 34vh; }
    .question .q { font-weight: 500; font-size: clamp(2.4rem, 5.4vw, 3.8rem); line-height: 1.04; }

    /* ---------- Stage 7 · Book 1 threshold ---------- */
    .book-threshold { padding-top: 16vh; padding-bottom: 26vh; }
    .book-threshold .invite { color: var(--muted); font-size: clamp(1.3rem, 2.4vw, 1.65rem); line-height: 1.5; }
    .book-threshold .title {
      margin-top: 2.4rem; font-weight: 500; font-size: clamp(2.6rem, 6vw, 4.4rem); line-height: .98; letter-spacing: -.02em;
      color: var(--gold);
      background-image: linear-gradient(100deg, #9b7427, #d7b85e 46%, #b8892c 72%, #ead27b);
      background-size: 160% 100%;
      -webkit-background-clip: text; background-clip: text; -webkit-text-fill-color: transparent;
    }
    .book-threshold .sub { margin-top: 1.2rem; color: var(--muted); font-style: italic; font-size: 1.15rem; }
    .book-threshold .open { margin-top: 3.4rem; }
    .book-threshold a {
      display: inline-flex; gap: .55rem; align-items: center; text-decoration: none;
      color: var(--gold); font: 600 .64rem/1.5 "Inter", Arial, sans-serif; letter-spacing: .16em; text-transform: uppercase;
    }
    .book-threshold a:hover, .book-threshold a:focus-visible { color: #e0bd61; }

    @media (max-width: 760px) {
      .field { grid-template-columns: repeat(6, minmax(0, 1fr)); grid-template-rows: none; row-gap: 3rem; padding: 12vh 1.4rem 6vh; }
      .field .piece { grid-row: auto !important; margin-top: 0 !important; }
      .field .piece:nth-of-type(odd)  { grid-column: 1 / 6 !important; }
      .field .piece:nth-of-type(even) { grid-column: 2 / 7 !important; }
      .numeral { grid-row: auto; text-align: left; order: -1; }
      .control { padding: 0 1.4rem 12vh; }
      .question { padding-top: 30vh; }
    }
  </style>
</head>
<body>

  <!-- Stage 1 · Threshold -->
  <section class="threshold" id="threshold" aria-label="Threshold">
    <div class="threshold-stack">
      <button class="door" id="door" type="button" aria-label="The Reading Room. Press and hold to enter.">
        <span class="gap"></span>
      </button>
      <div class="threshold-words" aria-hidden="true">
        <p class="label fade" id="t1"><span>△</span>The Reading Room</p>
        <p class="label hint fade" id="t2">Press and hold to enter</p>
      </div>
    </div>
  </section>
  <div class="flood" id="flood"></div>

  <!-- Stages 2–7 -->
  <main class="journey" id="journey">
    <div class="field" id="field" aria-live="polite"></div>
    <div class="control">
      <button class="next" id="next" type="button"><span class="t">Keep looking</span><span class="arrow" aria-hidden="true">↓</span></button>
    </div>

    <section class="question" id="question" aria-labelledby="q">
      <p class="q fade" id="q" tabindex="-1">Is this a pattern?</p>
    </section>

    <section class="book-threshold" id="book" aria-label="The investigation">
      <p class="invite fade" id="b1">These fragments come from a larger inquiry.</p>
      <p class="title fade" id="b2">What Is Trying<br>To Emerge?</p>
      <p class="sub fade" id="b3">A Modern Dharma Inquiry</p>
      <p class="open fade" id="b4">
        <a href="https://moderndharma.life/#book" target="_blank" rel="noopener noreferrer"><span aria-hidden="true">△</span><span>The investigation</span><span aria-hidden="true">→</span></a>
      </p>
    </section>
  </main>

  <script>
    /* ------------------------------------------------------------
       The constellations. Clues, not conclusions: moments just
       before recognition. No themes or captions appear on screen;
       the working themes below exist only for whoever edits this.
       A fragment is never placed beside its own chapter's
       Investigation Journal question.
       `slot` sets where a piece sits; array order is arrival order.
       ------------------------------------------------------------ */
    const BOOK = 'Book';
    const IJ = 'Investigation Journal';
    const CONSTELLATIONS = [
      { // I · Something keeps returning — "Interesting."
        numeral: 'I', layout: 'a',
        pieces: [
          { slot: 'p1', kind: 'book',    source: BOOK, place: 'Chapter 2 · Fixation',
            text: 'Nobody asked him to think about it. Nobody was waiting for an answer. Nobody would have noticed if he left it alone.' },
          { slot: 'p4', kind: 'field',   source: 'Field Observation', place: 'Mount Athos',
            text: 'A mountain casting its own triangular shadow across the landscape.' },
          { slot: 'p2', kind: 'book',    source: BOOK, place: 'Chapter 14 · Capacity',
            text: 'If nobody was watching, what was I becoming capable of?' },
          { slot: 'p3', kind: 'journal', source: IJ, place: 'Chapter 13',
            text: 'Why do some responsibilities give energy back?' }
        ]
      },
      { // II · Returning — "Strange."
        numeral: 'II', layout: 'b',
        pieces: [
          { slot: 'p1', kind: 'book',    source: BOOK, place: 'Chapter 11 · Krishna',
            text: 'I keep ending up in exactly the same place wearing different clothes.' },
          { slot: 'p3', kind: 'journal', source: IJ, place: 'Chapter 2',
            text: 'Why did he keep returning?' },
          { slot: 'p2', kind: 'book',    source: BOOK, place: 'Chapter 6 · Waiting',
            text: 'What do I actually want?' }
        ]
      },
      { // III · The first answer is not the answer — "Familiar."
        numeral: 'III', layout: 'c',
        pieces: [
          { slot: 'p2', kind: 'book',    source: BOOK, place: 'Chapter 5 · Process',
            text: '“I’ve been trying to teach chemical bonding.”\n“That was the plan.”\n“Wrong plan.”' },
          { slot: 'p3', kind: 'book',    source: BOOK, place: 'Chapter 12 · Again',
            text: 'I already know all this.\nI just don’t move.' },
          { slot: 'p1', kind: 'journal', source: IJ, place: 'Chapter 6',
            text: 'What am I waiting for?' },
          { slot: 'p4', kind: 'book',    source: BOOK, place: 'Chapter 13 · Mirror',
            text: 'You repeatedly become interested when something stops making sense.' }
        ]
      },
      { // IV · Another way through — "I've seen this."
        numeral: 'IV', layout: 'd',
        pieces: [
          { slot: 'p2', kind: 'field',   source: 'Field Observation', place: 'The garden',
            text: 'The garden changed.' },
          { slot: 'p1', kind: 'book',    source: BOOK, place: 'Chapter 18 · Possibility',
            text: 'It never really felt like his to keep.' },
          { slot: 'p4', kind: 'journal', source: IJ, place: 'Chapter 19',
            text: 'What was strength for if not this?' },
          { slot: 'p3', kind: 'journal', source: IJ, place: 'Chapter 11',
            text: 'Why do the same questions keep returning?' }
        ]
      }
    ];

    (() => {
      const $ = id => document.getElementById(id);
      const reduced = matchMedia('(prefers-reduced-motion: reduce)').matches;
      const wait = ms => new Promise(r => setTimeout(r, reduced ? Math.min(ms, 150) : ms));
      const show = el => requestAnimationFrame(() => requestAnimationFrame(() => el.classList.add('on')));

      /* ---------- Stage 1 · Threshold ---------- */
      const threshold = $('threshold'), door = $('door');
      const HOLD = parseFloat(getComputedStyle(document.documentElement).getPropertyValue('--hold'));
      let p = 0, holding = false, last = 0, raf = 0, entered = false;

      setTimeout(() => $('t1').classList.add('on'), reduced ? 0 : 1200);
      setTimeout(() => $('t2').classList.add('on'), reduced ? 0 : 3400);

      function tick(now) {
        const dt = last ? now - last : 16; last = now;
        p = Math.max(0, Math.min(1, p + (holding ? dt / HOLD : -dt / (HOLD * 1.6))));
        threshold.style.setProperty('--p', (p * p * (3 - 2 * p)).toFixed(4));
        if (p >= 1 && !entered) return enter();
        if (holding || p > 0) raf = requestAnimationFrame(tick); else { raf = 0; last = 0; }
      }
      const press = e => { if (entered) return; e.preventDefault(); holding = true; door.classList.add('held'); if (!raf) { last = 0; raf = requestAnimationFrame(tick); } };
      const release = () => { holding = false; door.classList.remove('held'); };
      door.addEventListener('pointerdown', e => { door.setPointerCapture?.(e.pointerId); press(e); });
      door.addEventListener('pointerup', release);
      door.addEventListener('pointercancel', release);
      door.addEventListener('contextmenu', e => e.preventDefault());
      door.addEventListener('keydown', e => { if ((e.key === ' ' || e.key === 'Enter') && !e.repeat) press(e); });
      door.addEventListener('keyup', e => { if (e.key === ' ' || e.key === 'Enter') release(); });
      door.focus({ preventScroll: true });

      async function enter() {
        entered = true; holding = false; cancelAnimationFrame(raf);
        const flood = $('flood');
        flood.classList.add('on');
        await wait(1500);
        threshold.remove();
        $('journey').classList.add('on');
        flood.classList.remove('on');
        await wait(1600);
        flood.remove();
        constellation(0);
      }

      /* ---------- Stages 2–5 · Constellations ---------- */
      const field = $('field'), next = $('next');
      let index = 0, busy = true;

      function render(item) {
        const fig = document.createElement('figure');
        fig.className = 'piece ' + (item.kind === 'field' ? 'field-note' : item.kind) + ' ' + item.slot;
        const q = document.createElement('blockquote');
        q.className = 'fade';
        q.textContent = item.text;
        const cap = document.createElement('figcaption');
        cap.className = 'fade';
        const b = document.createElement('b'); b.textContent = item.source;
        cap.append(b, item.place || '');
        fig.append(q, cap);
        return { fig, q, cap };
      }

      async function constellation(i) {
        busy = true;
        const c = CONSTELLATIONS[i];
        field.className = 'field layout-' + c.layout;
        field.innerHTML = '';
        field.setAttribute('aria-label', 'Constellation ' + c.numeral);
        // DOM order follows the slots, so phones read them top to bottom.
        const rendered = c.pieces.map(item => ({ item, ...render(item) }));
        [...rendered].sort((a, b) => a.item.slot.localeCompare(b.item.slot)).forEach(r => field.append(r.fig));
        const numeral = document.createElement('p');
        numeral.className = 'label numeral fade';
        numeral.textContent = c.numeral;
        field.append(numeral);

        window.scrollTo({ top: 0, behavior: 'auto' });
        await wait(700);
        show(numeral);
        await wait(1600);
        // Each clue arrives on its own; where it was found follows.
        for (const r of rendered) {
          show(r.q);
          await wait(1200);
          show(r.cap);
          await wait(2000);
        }
        await wait(3800);   // time to look before anything else is offered
        next.classList.add('ready');
        busy = false;
      }

      next.addEventListener('click', async () => {
        if (busy) return;
        busy = true;
        next.classList.remove('ready');
        field.classList.add('leaving');
        await wait(1200);
        if (index < CONSTELLATIONS.length - 1) {
          field.classList.remove('leaving');
          constellation(++index);
        } else {
          quiet();
        }
      });

      /* ---------- Stage 6 · The room goes quiet. Then the question. ---------- */
      async function quiet() {
        // The visitor asked for more. There is no more evidence; only the question.
        field.remove();
        next.parentElement.remove();
        window.scrollTo({ top: 0, behavior: 'auto' });
        await wait(4500);
        $('question').classList.add('on');
        show($('q')); $('q').focus({ preventScroll: true });

        /* ---------- Stage 7 · Book 1 threshold ---------- */
        await wait(9000);   // leave the question alone
        $('book').classList.add('on');
        // Keep the question in view above the invitation that answers to it.
        const qTop = $('q').getBoundingClientRect().top + scrollY;
        window.scrollTo({ top: Math.max(0, qTop - innerHeight * 0.14), behavior: reduced ? 'auto' : 'smooth' });
        await wait(1200);
        for (const id of ['b1', 'b2', 'b3', 'b4']) { show($(id)); await wait(id === 'b1' ? 2800 : 1600); }
      }
    })();
  </script>
</body>
</html>
